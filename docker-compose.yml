services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shipcomply
      POSTGRES_PASSWORD: shipcomply_dev
      POSTGRES_DB: shipcomply
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/seed-supabase.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipcomply"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
    profiles:
      - offline

volumes:
  postgres_data:
  ollama_data:
