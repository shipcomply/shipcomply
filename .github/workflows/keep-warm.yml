name: keep-warm

# Render's free tier spins the API down after ~15 min of inactivity, causing a
# ~50s cold start on the next request (the "Failed to fetch" the dashboard saw).
# This pings the health endpoint every 10 min to keep the instance awake.
# Note: free Render gives ~750 instance-hours/month, roughly enough for one
# always-on service. Manual run available via the "Run workflow" button.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Don't pile up overlapping pings if a run is slow during a cold start.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          URL="${KEEP_WARM_URL:-https://shipcomply-api.onrender.com/healthz}"
          echo "Pinging $URL"
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 70 "$URL" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake: $(head -c 120 /tmp/body.txt)"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::API did not return 200 after retries (may be deploying or down)"
          exit 1
    env:
      # Override in repo Settings -> Secrets and variables -> Actions -> Variables
      # if the API URL ever changes (e.g. a custom domain).
      KEEP_WARM_URL: ${{ vars.KEEP_WARM_URL }}
