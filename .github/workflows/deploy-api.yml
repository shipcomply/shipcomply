name: Deploy API to Koyeb

on:
  workflow_dispatch:  # manual only until KOYEB_API_TOKEN secret is configured

jobs:
  deploy:
    name: Deploy FastAPI to Koyeb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh

      - name: Deploy to Koyeb
        run: |
          koyeb service redeploy shipcomply-api/api
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
