services:
  # FastAPI Backend
  - type: web
    name: shipcomply-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn shipcomply_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OFFLINE
        value: "false"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://shipcomply.dev","https://www.shipcomply.dev","http://localhost:3000"]'
      - key: WEB_URL
        value: "https://shipcomply.dev"
      # Neon Postgres
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Clerk auth
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      # LLM providers
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      # Cloudflare
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: CF_R2_BUCKET
        value: "shipcomply-artifacts"
      - key: CF_R2_ENDPOINT
        sync: false
      - key: CF_KV_NAMESPACE_ID
        sync: false
      - key: CF_QUEUE_NAME
        value: "scan-jobs"
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Observability
      - key: SENTRY_DSN
        sync: false
      - key: LANGFUSE_HOST
        value: "https://cloud.langfuse.com"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false

  # Next.js Frontend
  - type: web
    name: shipcomply-web
    runtime: node
    buildCommand: cd apps/web && npm install --include=dev && npm run build
    startCommand: cd apps/web && npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://shipcomply-api.onrender.com
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: "/sign-in"
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: "/sign-up"
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: "/dashboard"
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: "/dashboard"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
